# Base de données
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/casino_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=${PORT:8081}
# Lazem ken el backend ykoun wara proxy (Nginx...), bech el IP s7i7a tetchaf fel rate limit
server.forward-headers-strategy=${FORWARD_HEADERS:none}

# JWT (el défaut hedha lel dev barka, badlou fel production)
app.jwt.secret=${JWT_SECRET:ChangeMoiCeSecretTresLongEtAleatoire123456}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Compte admin (yetsna3 awwel démarrage)
app.admin.username=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.email=${ADMIN_EMAIL:admin@casino.tn}

# Origines autorisées (sépare b virgule)
app.cors.origins=${CORS_ORIGINS:http://localhost:4200}