@if (auth.isLoggedIn()) {
  <header class="topbar">
    <a routerLink="/lobby" class="logo-link">
      <app-logo [size]="34" />
      <span class="brand">QARTAJ</span>
    </a>

    <nav>
      @if (auth.isAdmin()) {
        <a routerLink="/admin">Admin</a>
      }
      <span class="balance">
        {{ game.balance() | number: '1.0-0' }} <small>jetons</small>
      </span>
      <button class="logout" (click)="auth.logout()">Déconnexion</button>
    </nav>
  </header>
}

<router-outlet />

<footer class="foot">
  Jeu de démonstration : jetons virtuels uniquement, aucun argent réel.
</footer>
