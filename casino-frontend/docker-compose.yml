services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: casino_db
      MYSQL_USER: casino_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?définir DB_PASSWORD dans .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?définir DB_ROOT_PASSWORD dans .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./casino-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/casino_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: casino_user
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?définir JWT_SECRET dans .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?définir ADMIN_PASSWORD dans .env}
      CORS_ORIGINS: http://localhost:4200
    ports:
      - "8081:8081"

  frontend:
    build: ./casino-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  db_data: